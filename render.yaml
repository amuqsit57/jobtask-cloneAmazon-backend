# Render Blueprint.
#
# This file is applied ONLY to services created through New -> Blueprint.
# A service created manually as a Web Service ignores it entirely and uses the
# dashboard settings instead - which is why a manual service shows `npm install`
# in its build log rather than the `npm ci` below.
services:
  - type: web
    name: amazon-clone-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned so a build cannot pick up an unreleased Node track.
      - key: NODE_VERSION
        value: "22"
      # Generated by Render; never needs to be typed or committed.
      - key: JWT_SECRET
        generateValue: true
      # sync:false means "prompt me for this, do not store it in git".
      # Real credentials must never live in a public repository.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
